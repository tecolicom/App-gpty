[project]
name = "tecolicom-gpty"
version = "0.3.0"
description = "OpenAI GPT API Command Line Wrapper"
authors = [
    {name = "Kazumasa Utashiro", email = "kaz@utashiro.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "openai>=2.0,<3.0",
    "click>=8.0.0",
    "click-spinner>=0.1.10",
    "typer>=0.12.0",
]

[project.scripts]
gpty = "gpty.gpty:app"

[tool.poetry]
packages = [{include = "gpty"}]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
